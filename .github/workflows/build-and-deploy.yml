name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Scoped per-branch, not one global lock - otherwise a PR's own check run
  # and the real main-branch deploy pipeline queue behind each other.
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Only push on an actual merge to main - PR runs just prove the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/lee-stevens/portfolio:latest
            ghcr.io/lee-stevens/portfolio:sha-${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, unraid-portfolio]
    # Deliberately NOT actions/checkout - that creates a fresh, isolated
    # clone. Operate directly in the real deployment directory instead,
    # which is already a git clone tracking main. Unraid-specific by
    # design - this runner only ever runs on this one box.
    defaults:
      run:
        working-directory: /mnt/user/appdata/portfolio
    steps:
      - name: Pull latest source
        run: git pull origin main

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull updated image
        run: docker compose pull

      - name: Restart service
        run: docker compose up -d
